<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="RJ Nexus" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <circle cx="930" cy="160" r="230" fill="url(#glow)"/>

  <!-- network -->
  <g stroke="url(#accent)" stroke-width="1.6" stroke-opacity="0.55" fill="none">
    <line x1="930" y1="160" x2="800" y2="64"/>
    <line x1="930" y1="160" x2="1060" y2="58"/>
    <line x1="930" y1="160" x2="1120" y2="170"/>
    <line x1="930" y1="160" x2="1040" y2="262"/>
    <line x1="930" y1="160" x2="790" y2="252"/>
    <line x1="930" y1="160" x2="715" y2="156"/>
    <line x1="800" y1="64" x2="1060" y2="58" stroke-opacity="0.25"/>
    <line x1="1060" y1="58" x2="1120" y2="170" stroke-opacity="0.25"/>
    <line x1="1120" y1="170" x2="1040" y2="262" stroke-opacity="0.25"/>
    <line x1="1040" y1="262" x2="790" y2="252" stroke-opacity="0.25"/>
    <line x1="790" y1="252" x2="715" y2="156" stroke-opacity="0.25"/>
    <line x1="715" y1="156" x2="800" y2="64" stroke-opacity="0.25"/>
  </g>
  <circle cx="930" cy="160" r="40" fill="none" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="930" cy="160" r="24" fill="url(#accent)"/>
  <circle cx="800" cy="64" r="10" fill="#22D3EE"/>
  <circle cx="1060" cy="58" r="8" fill="#818CF8"/>
  <circle cx="1120" cy="170" r="11" fill="#22D3EE"/>
  <circle cx="1040" cy="262" r="9" fill="#818CF8"/>
  <circle cx="790" cy="252" r="11" fill="#818CF8"/>
  <circle cx="715" cy="156" r="8" fill="#22D3EE"/>

  <!-- logo mark -->
  <g transform="translate(70 62)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M22 2 L41 13 V35 L22 46 L3 35 V13 Z"/>
    <path d="M14 33 V15 L30 33 V15"/>
  </g>

  <!-- text -->
  <text x="70" y="160" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" fill="#F8FAFC">RJ Nexus</text>
  <text x="72" y="205" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#A5B4FC">Plugins, themes and tools for RJ CMS</text>
  <text x="72" y="248" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" letter-spacing="2" fill="#94A3B8">OPEN SOURCE   /   SELF-HOSTED   /   MODULAR</text>
</svg>
